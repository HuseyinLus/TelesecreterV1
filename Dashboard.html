<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telesecreter — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
/* ==========================================================================
   Telesecreter — Clinical, trustworthy dashboard
   ========================================================================== */

:root {
  /* Light mode */
  --bg:            oklch(98.8% 0.004 220);
  --bg-subtle:     oklch(97.2% 0.006 220);
  --surface:       oklch(100% 0 0);
  --surface-2:     oklch(99% 0.003 220);
  --border:        oklch(92% 0.008 220);
  --border-strong: oklch(86% 0.012 220);
  --ink:           oklch(22% 0.022 250);
  --ink-2:         oklch(38% 0.018 250);
  --ink-3:         oklch(55% 0.014 240);
  --ink-4:         oklch(72% 0.01 240);

  --accent:        oklch(56% 0.09 210);   /* calm teal-blue */
  --accent-soft:   oklch(94% 0.03 210);
  --accent-ink:    oklch(34% 0.08 210);

  --sage:          oklch(62% 0.07 160);   /* AI accent */
  --sage-soft:     oklch(94% 0.03 160);
  --sage-ink:      oklch(36% 0.06 160);

  --amber:         oklch(72% 0.11 70);
  --amber-soft:    oklch(95% 0.04 70);

  --rose:          oklch(66% 0.11 20);
  --rose-soft:     oklch(95% 0.03 20);

  --indigo:        oklch(56% 0.11 270);
  --indigo-soft:   oklch(94% 0.035 270);

  --teal:          oklch(58% 0.09 200);
  --teal-soft:     oklch(94% 0.03 200);

  --danger:        oklch(58% 0.18 25);
  --warning:       oklch(72% 0.15 75);

  --shadow-sm: 0 1px 2px oklch(20% 0.04 240 / 0.04), 0 1px 3px oklch(20% 0.04 240 / 0.05);
  --shadow-md: 0 4px 12px oklch(20% 0.04 240 / 0.05), 0 2px 4px oklch(20% 0.04 240 / 0.04);
  --shadow-lg: 0 24px 48px oklch(20% 0.04 240 / 0.10), 0 8px 16px oklch(20% 0.04 240 / 0.05);

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
}

.dark {
  --bg:            oklch(16% 0.012 240);
  --bg-subtle:     oklch(18% 0.014 240);
  --surface:       oklch(21% 0.015 240);
  --surface-2:     oklch(19% 0.014 240);
  --border:        oklch(28% 0.016 240);
  --border-strong: oklch(34% 0.018 240);
  --ink:           oklch(96% 0.005 240);
  --ink-2:         oklch(82% 0.008 240);
  --ink-3:         oklch(64% 0.012 240);
  --ink-4:         oklch(48% 0.014 240);

  --accent:        oklch(72% 0.11 210);
  --accent-soft:   oklch(30% 0.06 210);
  --accent-ink:    oklch(85% 0.08 210);

  --sage:          oklch(72% 0.08 160);
  --sage-soft:     oklch(28% 0.05 160);
  --sage-ink:      oklch(85% 0.06 160);

  --amber-soft:    oklch(30% 0.06 70);
  --rose-soft:     oklch(28% 0.06 20);
  --indigo-soft:   oklch(28% 0.06 270);
  --teal-soft:     oklch(28% 0.06 200);

  --shadow-sm: 0 1px 2px #0006;
  --shadow-md: 0 4px 12px #0006;
  --shadow-lg: 0 24px 48px #0008;
}

* { box-sizing: border-box; }

html, body, #root { height: 100%; margin: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 13px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  font-feature-settings: 'ss01', 'cv11';
  -webkit-font-smoothing: antialiased;
  transition: background .25s, color .25s;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* =====================================================
   App shell
   ===================================================== */

.app {
  display: grid;
  grid-template-columns: 232px 1fr;
  height: 100vh;
  overflow: hidden;
}

.main {
  display: grid;
  grid-template-rows: auto 1fr;
  min-height: 0;
  overflow: hidden;
  background: var(--bg);
}

.main-body {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 18px;
  padding: 0 24px 24px;
  overflow: hidden;
  min-height: 0;
}
.main-body.no-rail { grid-template-columns: 1fr; }

.center-scroll {
  overflow: auto;
  min-height: 0;
  padding-right: 4px;
}
.rail-scroll {
  overflow: auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding-bottom: 8px;
}

/* =====================================================
   Sidebar
   ===================================================== */

.sidebar {
  display: flex;
  flex-direction: column;
  padding: 18px 14px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  gap: 4px;
  min-height: 0;
}

.sb-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 14px;
  margin-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.sb-logo {
  width: 32px; height: 32px;
  background: var(--accent);
  color: white;
  border-radius: 9px;
  display: grid; place-items: center;
  box-shadow: 0 0 0 1px oklch(0% 0 0 / 0.04), 0 4px 10px oklch(56% 0.09 210 / 0.24);
}
.sb-brand-name { font-weight: 600; font-size: 13.5px; color: var(--ink); letter-spacing: -0.005em; }
.sb-brand-sub  { font-size: 11px; color: var(--ink-3); margin-top: 1px; }

.sb-section-label {
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--ink-4);
  padding: 10px 10px 6px;
  font-weight: 500;
}

.sb-nav { display: flex; flex-direction: column; gap: 2px; }

.sb-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--ink-2);
  font-weight: 500;
  transition: background .15s, color .15s;
  text-align: left;
}
.sb-item:hover { background: var(--bg-subtle); color: var(--ink); }
.sb-active { background: var(--accent-soft); color: var(--accent-ink); }
.sb-active svg { color: var(--accent); }

.sb-badge {
  margin-left: auto;
  background: var(--accent);
  color: white;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 16px;
  text-align: center;
}

.sb-spacer { flex: 1; }

.sb-ai-card {
  border: 1px solid var(--border);
  background: var(--surface-2);
  padding: 10px 12px;
  border-radius: var(--radius-md);
  margin: 8px 2px;
}
.sb-ai-head {
  display: flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--ink-2); font-weight: 500;
}
.sb-ai-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--sage);
  box-shadow: 0 0 0 3px oklch(62% 0.07 160 / 0.18);
  animation: pulse 2s infinite;
}
.sb-ai-stats {
  display: flex; gap: 14px;
  margin-top: 6px;
}
.sb-ai-stats > div { display: flex; flex-direction: column; }
.sb-ai-stats b { font-size: 15px; color: var(--ink); font-weight: 600; }
.sb-ai-stats span { font-size: 10.5px; color: var(--ink-3); }

.sb-nav-bottom { margin-top: 4px; }

.sb-user {
  display: flex; align-items: center; gap: 10px;
  padding: 8px;
  border-radius: 8px;
  margin-top: 6px;
  border: 1px solid var(--border);
  background: var(--surface-2);
}
.sb-user:hover { background: var(--bg-subtle); }
.sb-avatar {
  width: 30px; height: 30px;
  background: oklch(68% 0.08 210);
  color: white;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 600;
}
.sb-user-meta { flex: 1; min-width: 0; }
.sb-user-name { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.sb-user-role { font-size: 10.5px; color: var(--ink-3); }

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 3px oklch(62% 0.07 160 / 0.18); }
  50%      { box-shadow: 0 0 0 5px oklch(62% 0.07 160 / 0.10); }
}

/* =====================================================
   Topbar
   ===================================================== */

.topbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 18px 24px 16px;
  gap: 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.tb-left { min-width: 0; }
.tb-eyebrow {
  font-size: 11px;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;
  margin-bottom: 4px;
}
.tb-title {
  font-family: 'Instrument Serif', 'Times New Roman', serif;
  font-size: 26px;
  font-weight: 400;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin: 0;
}

.tb-center { display: flex; justify-content: center; padding-left: 80px; }
.tb-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: 10px;
  width: 420px;
  transition: border-color .15s, box-shadow .15s;
}
.tb-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tb-search svg { color: var(--ink-3); flex-shrink: 0; }
.tb-search input {
  border: none; outline: none; background: transparent; flex: 1;
  font-size: 13px; color: var(--ink);
}
.tb-search input::placeholder { color: var(--ink-4); }
.tb-search kbd {
  font-family: inherit;
  font-size: 10.5px;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--border-strong);
  color: var(--ink-3);
  background: var(--bg-subtle);
}

.tb-right {
  display: flex; align-items: center; gap: 8px; justify-content: flex-end;
}
.tb-icon-btn {
  position: relative;
  width: 34px; height: 34px;
  border-radius: 9px;
  display: grid; place-items: center;
  color: var(--ink-2);
  border: 1px solid var(--border);
  background: var(--surface);
  transition: background .15s, border-color .15s;
}
.tb-icon-btn:hover { background: var(--bg-subtle); color: var(--ink); }
.tb-dot {
  position: absolute;
  top: 7px; right: 7px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--rose);
  border: 2px solid var(--surface);
}
.tb-divider { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
.tb-primary {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 14px;
  background: var(--ink);
  color: var(--bg);
  border-radius: 9px;
  font-size: 12.5px; font-weight: 500;
  transition: transform .1s, opacity .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.tb-primary:hover { opacity: 0.88; }
.tb-primary:active { transform: scale(0.98); }

/* =====================================================
   Calendar toolbar
   ===================================================== */

.ct {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 14px 0;
  gap: 12px;
}
.ct-left { display: flex; align-items: center; gap: 12px; }
.ct-week-nav {
  display: flex; align-items: center; gap: 2px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 2px;
}
.ct-nav-btn {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  color: var(--ink-2); border-radius: 7px;
}
.ct-nav-btn:hover { background: var(--bg-subtle); color: var(--ink); }
.ct-today-btn {
  padding: 5px 12px;
  font-size: 12px; font-weight: 500;
  color: var(--ink-2);
  border-radius: 7px;
}
.ct-today-btn:hover { background: var(--bg-subtle); color: var(--ink); }
.ct-week-label {
  font-family: 'Instrument Serif', serif;
  font-size: 20px;
  color: var(--ink);
  letter-spacing: -0.005em;
  white-space: nowrap;
}

.ct-center { display: flex; align-items: center; gap: 10px; justify-content: center; }
.ct-seg {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 3px;
}
.ct-seg-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px;
  font-size: 12px;
  color: var(--ink-3);
  border-radius: 6px;
  font-weight: 500;
  transition: background .15s, color .15s;
  white-space: nowrap;
}
.ct-seg-btn:hover { color: var(--ink); }
.ct-seg-active {
  background: var(--bg-subtle);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}
.ct-seg-dot {
  width: 7px; height: 7px; border-radius: 50%;
}
.ct-dot-ai { background: var(--sage); }
.ct-dot-human { background: var(--accent); }

.ct-filter {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 0 10px;
  height: 32px;
  color: var(--ink-3);
}
.ct-filter select {
  border: none; outline: none; background: transparent;
  font-size: 12px; color: var(--ink-2); font-family: inherit;
  font-weight: 500; cursor: pointer;
  padding-right: 2px;
  white-space: nowrap;
}
.ct-filter { white-space: nowrap; }

.ct-right { display: flex; justify-content: flex-end; }

/* =====================================================
   Week calendar
   ===================================================== */

.wk-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.wk-header {
  display: grid;
  grid-template-columns: 64px repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
}
.wk-gutter { }
.wk-day-head {
  padding: 12px 10px;
  text-align: center;
  border-left: 1px solid var(--border);
}
.wk-day-label {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-3);
  font-weight: 500;
}
.wk-day-date {
  font-family: 'Instrument Serif', serif;
  font-size: 22px;
  color: var(--ink);
  margin-top: 2px;
  line-height: 1;
}
.wk-today .wk-day-date {
  display: inline-grid;
  place-items: center;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  font-size: 15px;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
}
.wk-today .wk-day-label { color: var(--accent); }

.wk-body {
  display: grid;
  grid-template-columns: 64px repeat(7, 1fr);
  position: relative;
}

.wk-gutter-body { padding-top: 0; }
.wk-hour-label {
  height: 60px;
  padding-right: 8px;
  text-align: right;
  font-size: 10.5px;
  color: var(--ink-4);
  position: relative;
  padding-top: 0;
}
.wk-hour-label span {
  position: relative;
  top: -6px;
  font-variant-numeric: tabular-nums;
}

.wk-grid {
  grid-column: 2 / -1;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  position: relative;
}

.wk-hlines {
  position: absolute; inset: 0;
  pointer-events: none;
}
.wk-hline {
  height: 60px;
  border-top: 1px solid var(--border);
}
.wk-hline:first-child { border-top: none; }

.wk-col {
  position: relative;
  border-left: 1px solid var(--border);
  min-height: 660px;
}
.wk-col-today {
  background: linear-gradient(180deg, oklch(56% 0.09 210 / 0.04), transparent 30%);
}

/* =====================================================
   Events
   ===================================================== */

.ev {
  position: absolute;
  left: 4px; right: 4px;
  padding: 0;
  border-radius: 7px;
  background: var(--surface);
  border: 1px solid transparent;
  text-align: left;
  overflow: hidden;
  display: flex;
  transition: box-shadow .15s, transform .1s, border-color .15s;
  min-height: 26px;
  cursor: pointer;
}
.ev:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
  z-index: 5;
}
.ev-selected {
  box-shadow: 0 0 0 2px var(--accent), var(--shadow-md) !important;
  z-index: 6;
}

.ev-stripe {
  width: 3px;
  flex-shrink: 0;
}
.ev-body {
  flex: 1;
  padding: 4px 8px 4px 7px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.ev-row-top {
  display: flex; align-items: center; gap: 5px;
}
.ev-time {
  font-size: 10px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
  letter-spacing: -0.01em;
}
.ev-ai {
  display: inline-flex; align-items: center; gap: 2px;
  background: var(--sage-soft);
  color: var(--sage-ink);
  font-size: 9px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 4px;
  letter-spacing: 0.03em;
}
.ev-patient {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ev-doctor {
  font-size: 10px;
  color: var(--ink-3);
  display: flex; align-items: center; gap: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ev-pending {
  border-style: dashed !important;
}
.ev-pending-tag {
  font-size: 9.5px;
  color: var(--amber);
  font-weight: 500;
}

/* Doctor color variants — background, stripe, border */
.ev-teal   { background: var(--teal-soft); border-color: oklch(58% 0.09 200 / 0.18); }
.ev-teal   .ev-stripe { background: var(--teal); }
.ev-sage   { background: var(--sage-soft); border-color: oklch(62% 0.07 160 / 0.20); }
.ev-sage   .ev-stripe { background: var(--sage); }
.ev-amber  { background: var(--amber-soft); border-color: oklch(72% 0.11 70 / 0.24); }
.ev-amber  .ev-stripe { background: var(--amber); }
.ev-indigo { background: var(--indigo-soft); border-color: oklch(56% 0.11 270 / 0.20); }
.ev-indigo .ev-stripe { background: var(--indigo); }
.ev-rose   { background: var(--rose-soft); border-color: oklch(66% 0.11 20 / 0.22); }
.ev-rose   .ev-stripe { background: var(--rose); }

/* Now indicator */
.now-line {
  position: absolute;
  left: -6px; right: 0;
  height: 0;
  z-index: 3;
  pointer-events: none;
}
.now-dot {
  position: absolute;
  left: 0; top: -4px;
  width: 9px; height: 9px;
  background: var(--rose);
  border-radius: 50%;
  box-shadow: 0 0 0 3px oklch(66% 0.11 20 / 0.2);
}
.now-bar {
  height: 1.5px;
  background: var(--rose);
  margin-left: 10px;
}

/* =====================================================
   Legend
   ===================================================== */

.legend {
  display: flex; flex-wrap: wrap; gap: 14px;
  padding: 14px 2px;
  margin-top: 8px;
  border-top: 1px solid var(--border);
  font-size: 11.5px;
}
.legend-item {
  display: flex; align-items: center; gap: 6px;
  color: var(--ink-3);
}
.legend-dot {
  width: 9px; height: 9px; border-radius: 50%;
  flex-shrink: 0;
}
.legend-teal   { background: var(--teal); }
.legend-sage   { background: var(--sage); }
.legend-amber  { background: var(--amber); }
.legend-indigo { background: var(--indigo); }
.legend-rose   { background: var(--rose); }
.legend-name { font-weight: 500; color: var(--ink-2); }
.legend-spec { color: var(--ink-4); }

/* =====================================================
   Right rail
   ===================================================== */

.rr-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
  box-shadow: var(--shadow-sm);
}

.rr-card-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 10px;
}
.rr-card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.005em;
}
.rr-card-sub {
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 2px;
}
.rr-ghost-btn {
  font-size: 11px;
  color: var(--ink-3);
  padding: 3px 8px;
  border-radius: 6px;
  font-weight: 500;
}
.rr-ghost-btn:hover { background: var(--bg-subtle); color: var(--ink-2); }

.rr-list {
  display: flex; flex-direction: column;
  gap: 1px;
  margin: 0 -6px;
}

.rr-item {
  display: grid;
  grid-template-columns: 48px 3px 1fr auto;
  gap: 10px;
  padding: 9px 8px;
  border-radius: 8px;
  text-align: left;
  position: relative;
  align-items: start;
  transition: background .12s;
}
.rr-item:hover { background: var(--bg-subtle); }
.rr-selected { background: var(--accent-soft) !important; }

// Week-grid calendar, Google-Calendar style
// Hours 8–18. Column per day. Appointments positioned absolutely.

const HOURS = Array.from({ length: 11 }, (_, i) => 8 + i); // 8..18
const HOUR_HEIGHT = 60; // px per hour
const TOP_OFFSET = 8; // small padding inside day column

const toMinutes = (hhmm) => {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
};

const DOCTOR_BY_ID = Object.fromEntries(window.DOCTORS.map((d) => [d.id, d]));

const AppointmentBlock = ({ appt, onClick, isSelected }) => {
  const doctor = DOCTOR_BY_ID[appt.doctorId];
  const startM = toMinutes(appt.start);
  const top = TOP_OFFSET + (startM - 8 * 60) / 60 * HOUR_HEIGHT;
  const height = appt.dur / 60 * HOUR_HEIGHT - 3;

  const colorClass = `ev-${doctor.color}`;
  const isShort = appt.dur <= 30;

  return (
    <button
      className={`ev ${colorClass} ${appt.status === 'pending' ? 'ev-pending' : ''} ${isSelected ? 'ev-selected' : ''}`}
      style={{ top: `${top}px`, height: `${height}px` }}
      onClick={(e) => {e.stopPropagation();onClick && onClick(appt);}}
      title={`${appt.patient} — ${doctor.name}`}>
      
      <div className="ev-stripe" />
      <div className="ev-body">
        <div className="ev-row-top">
          <span className="ev-time">{appt.start}</span>
          {appt.aiBooked &&
          <span className="ev-ai" title="Booked by voice AI">
              <svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 2a5 5 0 00-5 5v4a5 5 0 0010 0V7a5 5 0 00-5-5z" />
                <path d="M19 10v1a7 7 0 01-14 0v-1" />
              </svg>
              AI
            </span>
          }
        </div>
        <div className="ev-patient">{appt.patient}</div>
        {!isShort &&
        <div className="ev-doctor">
            <span className="ev-dot" />
            {doctor.name.replace('Dr. ', '')}
          </div>
        }
        {appt.status === 'pending' && <div className="ev-pending-tag">Pending confirmation</div>}
      </div>
    </button>);

};

const NowIndicator = ({ dayIndex, currentMinutes }) => {
  const top = TOP_OFFSET + (currentMinutes - 8 * 60) / 60 * HOUR_HEIGHT;
  if (currentMinutes < 8 * 60 || currentMinutes > 18 * 60) return null;
  return (
    <div className="now-line" style={{ top: `${top}px` }}>
      <div className="now-dot" />
      <div className="now-bar" />
    </div>);

};

const WeekCalendar = ({ appointments, onSelectAppt, selectedId, filters, currentMinutes = 10 * 60 + 18, todayDayIndex = 3 }) => {
  const filtered = appointments.filter((a) => {

    if (filters.ai === 'human' && a.aiBooked) return false;
    if (filters.doctor !== 'all' && a.doctorId !== filters.doctor) return false;
    return true;
  });

  return (
    <div className="wk-wrap">
      <div className="wk-header">
        <div className="wk-gutter" />
        {window.WEEK_DAYS.map((d, i) =>
        <div key={i} className={`wk-day-head ${d.today ? 'wk-today' : ''}`}>
            <div className="wk-day-label">{d.label}</div>
            <div className="wk-day-date">{d.date}</div>
          </div>
        )}
      </div>

      <div className="wk-body">
        <div className="wk-gutter wk-gutter-body">
          {HOURS.map((h) =>
          <div key={h} className="wk-hour-label">
              <span>{String(h).padStart(2, '0')}:00</span>
            </div>
          )}
        </div>

        <div className="wk-grid">
          {/* horizontal hour lines */}
          <div className="wk-hlines">
            {HOURS.map((h) => <div key={h} className="wk-hline" />)}
          </div>

          {/* day columns */}
          {window.WEEK_DAYS.map((d, i) =>
          <div key={i} className={`wk-col ${d.today ? 'wk-col-today' : ''}`}>
              {/* vertical column border */}
              {i === todayDayIndex &&

const AICallMonitor = ({ visible = true, onClose }) => {
  const [live, setLive] = React.useState({
    caller: '+90 532 ••• 71 02',
    seconds: 47,
    state: 'Confirming time slot',
    transcript: [
    { who: 'ai', t: 'Hello, this is Riverside Clinic\'s assistant. How can I help you?' },
    { who: 'user', t: 'I\'d like to book an appointment with Dr. Demir.' },
    { who: 'ai', t: 'Of course. What day works best for you?' },
    { who: 'user', t: 'Friday afternoon if possible.' },
    { who: 'ai', t: 'I have 13:30 or 15:00 with Dr. Demir on Friday. Which do you prefer?' }]

  });

  React.useEffect(() => {
    if (!visible) return;
    const iv = setInterval(() => {
      setLive((l) => ({ ...l, seconds: l.seconds + 1 }));
    }, 1000);
    return () => clearInterval(iv);
  }, [visible]);

  if (!visible) return null;

  const mm = String(Math.floor(live.seconds / 60)).padStart(2, '0');
  const ss = String(live.seconds % 60).padStart(2, '0');

  return (
    <div className="rr-card rr-call-card">
      <div className="rr-call-head">
        <div className="rr-call-live">
          <span className="rr-pulse" />
          Live call
        </div>

            <div className="dr-label">When</div>
            <div className="dr-value">Thu · Apr 16, 2026</div>

          </div>
          <div className="dr-field">
            <div className="dr-label">Reason</div>
            <div className="dr-value">{appt.reason}</div>
          </div>
          <div className="dr-field">
            <div className="dr-label">Patient</div>

          </div>

        {appt.aiBooked &&

function addMin(hhmm, min) {
  const [h, m] = hhmm.split(':').map(Number);
  const total = h * 60 + m + min;
  return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
}

// Dense list/table view
const ListView = ({ appointments, onSelect, selectedId, filters }) => {
  const filtered = appointments.
  filter((a) => {
    if (filters.ai === 'ai' && !a.aiBooked) return false;
    if (filters.ai === 'human' && a.aiBooked) return false;
    if (filters.doctor !== 'all' && a.doctorId !== filters.doctor) return false;
    return true;
  }).
  sort((a, b) => a.day - b.day || a.start.localeCompare(b.start));

  return (
    <div className="lv">
      <div className="lv-head">
        <div>Day</div><div>Time</div><div>Patient</div><div>Doctor</div><div>Reason</div><div>Source</div><div>Status</div>
      </div>
      <div className="lv-body">
        {filtered.map((a) => {
          const d = DOCTOR_BY_ID_D[a.doctorId];
          const day = window.WEEK_DAYS[a.day];
          return (
            <button key={a.id} className={`lv-row ${selectedId === a.id ? 'lv-selected' : ''} ${day.today ? 'lv-today' : ''}`} onClick={() => onSelect(a)}>
              <div className="lv-day"><span className="lv-day-label">{day.label}</span> {day.date}</div>
              <div className="lv-time">{a.start} <span className="lv-dur">· {a.dur}m</span></div>
              <div className="lv-patient">{a.patient}</div>
              <div className="lv-doctor"><span className={`legend-dot legend-${d.color}`} /> {d.name.replace('Dr. ', '')}</div>
              <div className="lv-reason">{a.reason}</div>
              <div className="lv-source">
                {a.aiBooked ? <span className="rr-ai-chip">AI</span> : <span className="lv-human">Staff</span>}
              </div>
              <div className="lv-status">
                <span className={`dr-chip ${a.status === 'pending' ? 'dr-chip-pending' : 'dr-chip-ok'}`}>{a.status}</span>
              </div>
            </button>);

        })}
      </div>
    </div>);

};

// Single-day expanded view
const DayView = ({ appointments, dayIndex, onSelect, selectedId, filters, currentMinutes }) => {
  const filtered = appointments.
  filter((a) => a.day === dayIndex).
  filter((a) => {
    if (filters.ai === 'ai' && !a.aiBooked) return false;
    if (filters.ai === 'human' && a.aiBooked) return false;
    if (filters.doctor !== 'all' && a.doctorId !== filters.doctor) return false;
    return true;
  });

  const HOURS_D = Array.from({ length: 11 }, (_, i) => 8 + i);
  const H = 72;
  const toMin = (s) => {const [h, m] = s.split(':').map(Number);return h * 60 + m;};

  const byDoctor = window.DOCTORS.map((d) => ({
    doctor: d,
    appts: filtered.filter((a) => a.doctorId === d.id)
  }));

  return (
    <div className="dv">
      <div className="dv-header">
        <div className="dv-gutter" />
        {byDoctor.map(({ doctor }) =>
        <div key={doctor.id} className="dv-col-head">
            <div className={`dv-avatar av-${doctor.color}`}>{doctor.initials}</div>
            <div>
              <div className="dv-col-name">{doctor.name.replace('Dr. ', '')}</div>
              <div className="dv-col-spec">{doctor.specialty}</div>
            </div>
          </div>
        )}
      </div>
      <div className="dv-body">
        <div className="dv-gutter dv-gutter-body">
          {HOURS_D.map((h) => <div key={h} className="dv-hour" style={{ height: H }}><span>{String(h).padStart(2, '0')}:00</span></div>)}
        </div>
        {byDoctor.map(({ doctor, appts }) =>
        <div key={doctor.id} className="dv-col">
            {HOURS_D.map((h) => <div key={h} className="dv-hline" style={{ height: H }} />)}
            {/* now line only on day 3 = today */}
            {dayIndex === 3 && currentMinutes >= 8 * 60 && currentMinutes <= 18 * 60 &&
          <div className="now-line" style={{ top: 8 + (currentMinutes - 8 * 60) / 60 * H }}>
                <div className="now-dot" /><div className="now-bar" />
              </div>
          }
            {appts.map((a) => {
            const top = 8 + (toMin(a.start) - 8 * 60) / 60 * H;
            const height = a.dur / 60 * H - 4;
            return (
              <button
                key={a.id}
                className={`ev ev-${doctor.color} ${selectedId === a.id ? 'ev-selected' : ''}`}
                style={{ top, height, left: 4, right: 4, width: 'auto' }}
                onClick={() => onSelect(a)}>
                
                  <div className="ev-stripe" />
                  <div className="ev-body">
                    <div className="ev-row-top">
                      <span className="ev-time">{a.start}</span>
                      {a.aiBooked && <span className="ev-ai"><svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a5 5 0 00-5 5v4a5 5 0 0010 0V7a5 5 0 00-5-5z" /><path d="M19 10v1a7 7 0 01-14 0v-1" /></svg>AI</span>}
                    </div>
                    <div className="ev-patient">{a.patient}</div>
                    <div className="ev-doctor">{a.reason}</div>
                  </div>
                </button>);

          })}
          </div>
        )}
      </div>
    </div>);

};

window.ListView = ListView;
window.DayView = DayView;


// ===== components/App.jsx =====
const { useState, useEffect } = React;

const DEFAULT_TWEAKS = /*EDITMODE-BEGIN*/{
  "view": "week",
  "showAIMonitor": true,
  "dark": false
} /*EDITMODE-END*/;

function App() {
  const [view, setView] = useState(DEFAULT_TWEAKS.view);
  const [showAIMonitor, setShowAIMonitor] = useState(DEFAULT_TWEAKS.showAIMonitor);
  const [dark, setDark] = useState(DEFAULT_TWEAKS.dark);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [editModeAvailable, setEditModeAvailable] = useState(false);

  const [selectedAppt, setSelectedAppt] = useState(null);
  const [filters, setFilters] = useState({ ai: 'all', doctor: 'all' });
  const [appointments, setAppointments] = useState(window.APPOINTMENTS);
  const [currentMinutes, setCurrentMinutes] = useState(10 * 60 + 18);

  // Persist playback-like state (view + flags)
  useEffect(() => {
    const saved = localStorage.getItem('tele-state');
    if (saved) {
      try {
        const s = JSON.parse(saved);
        if (s.view) setView(s.view);
        if (typeof s.showAIMonitor === 'boolean') setShowAIMonitor(s.showAIMonitor);
        if (typeof s.dark === 'boolean') setDark(s.dark);
      } catch (e) {}
    }
  }, []);
  useEffect(() => {
    localStorage.setItem('tele-state', JSON.stringify({ view, showAIMonitor, dark }));
  }, [view, showAIMonitor, dark]);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
  }, [dark]);

  // slowly animate now-line for liveliness
  useEffect(() => {
    const iv = setInterval(() => setCurrentMinutes((m) => m + 1), 30000);
    return () => clearInterval(iv);
  }, []);

  // Tweaks host protocol
  useEffect(() => {
    const handler = (e) => {
      const d = e.data;
      if (!d || typeof d !== 'object') return;
      if (d.type === '__activate_edit_mode') setTweaksOpen(true);
      if (d.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    setEditModeAvailable(true);
    try {
      window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    } catch (e) {}
    return () => window.removeEventListener('message', handler);
  }, []);

  const persistTweak = (patch) => {
    try {
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*');
    } catch (e) {}
  };

  const handleConfirm = (appt) => {
    setAppointments((list) => list.map((a) => a.id === appt.id ? { ...a, status: 'confirmed' } : a));
    setSelectedAppt((s) => s ? { ...s, status: 'confirmed' } : s);
  };
  const handleCancel = (appt) => {
    setAppointments((list) => list.filter((a) => a.id !== appt.id));
    setSelectedAppt(null);
  };

  return (
    <div className={`app ${dark ? 'dark' : ''}`}>
      <Sidebar active="dashboard" />

      <div className="main">
        <TopBar />

        <div className={`main-body ${!showAIMonitor && view !== 'list' ? '' : ''}`}>
          <div className="center-scroll">
            <CalendarToolbar
              view={view}
              onView={setView}
              weekLabel="April 13 – 19, 2026"
              filters={filters}
              setFilters={setFilters}
              onPrev={() => {}}
              onNext={() => {}}
              onToday={() => {}} />
            

            {view === 'week' &&
            <WeekCalendar
              appointments={appointments}
              onSelectAppt={setSelectedAppt}
              selectedId={selectedAppt?.id}
              filters={filters}
              currentMinutes={currentMinutes}
              todayDayIndex={3} />

            }
            {view === 'day' &&
            <DayView
              appointments={appointments}
              dayIndex={3}
              onSelect={setSelectedAppt}
              selectedId={selectedAppt?.id}
              filters={filters}
              currentMinutes={currentMinutes} />

            }
            {view === 'list' &&
            <ListView
              appointments={appointments}
              onSelect={setSelectedAppt}
              selectedId={selectedAppt?.id}
              filters={filters} />

            }

            <DoctorLegend />
          </div>

          <div className="rail-scroll">
            <TodayList
              appointments={appointments}
              onSelect={setSelectedAppt}
              selectedId={selectedAppt?.id}
              currentMinutes={currentMinutes} />
            
            {showAIMonitor &&
            <AICallMonitor
              visible={showAIMonitor}
              onClose={() => {setShowAIMonitor(false);persistTweak({ showAIMonitor: false });}} />

            }
            <AIStatsStrip />
          </div>
        </div>
      </div>

      <AppointmentDrawer
        appt={selectedAppt}
        onClose={() => setSelectedAppt(null)}
        onConfirm={handleConfirm}
        onCancel={handleCancel} />
      

      {tweaksOpen &&
      <div className="tweaks">
          <div className="tw-head">
            <div className="tw-title">Tweaks</div>
            <button className="tw-close" onClick={() => setTweaksOpen(false)}>
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6L6 18M6 6l12 12" /></svg>
            </button>
          </div>

          <div className="tw-row">
            <span className="tw-label">Calendar view</span>
            <div className="tw-seg">
              {['day', 'week', 'list'].map((v) =>
            <button
              key={v}
              className={`tw-seg-btn ${view === v ? 'on' : ''}`}
              onClick={() => {setView(v);persistTweak({ view: v });}}>
              {v[0].toUpperCase() + v.slice(1)}</button>
            )}
            </div>
          </div>

          <div className="tw-row">
            <span className="tw-label">AI call monitor</span>
            <div className={`tw-switch ${showAIMonitor ? 'on' : ''}`} onClick={() => {const nv = !showAIMonitor;setShowAIMonitor(nv);persistTweak({ showAIMonitor: nv });}} />
          </div>

          <div className="tw-row">
            <span className="tw-label">Dark mode</span>
            <div className={`tw-switch ${dark ? 'on' : ''}`} onClick={() => {const nv = !dark;setDark(nv);persistTweak({ dark: nv });}} />
          </div>
        </div>
      }
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
